<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilhadão Açaí - Fornecedores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo_container">
            <img src="imagens/logo_pilhadao.png" alt="Logo Pilhadão Açaí">
        </div>
        <ul class="menu_navegacao">
            <li><a href="index.html">Visão Geral</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="categorias.html">Categorias</a></li>
            <li><a href="fornecedores.html" class="ativo">Fornecedores</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
        <div class="sidebar_rodape">
            <button id="btn_logout" class="btn_sair">Sair do Sistema</button>
        </div>
    </aside>

    <main class="conteudo_principal">
        <header class="topbar">
            <div>
                <h1>Gerenciamento de Fornecedores</h1>
                <p>Controle os distribuidores parceiros, contatos comerciais e endereços</p>
            </div>
            <button id="btn_abrir_modal_fornecedor" class="btn_primario">+ Novo Fornecedor</button>
        </header>

        <section class="barra_filtros">
            <input type="text" id="input_busca_fornecedor" placeholder="Buscar fornecedor por nome ou CNPJ...">
        </section>

        <section class="container_tabela">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Empresa / Fornecedor</th>
                        <th>CNPJ</th>
                        <th>Telefone</th>
                        <th>Contato</th>
                        <th>Cidade / UF</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela_fornecedores">
                    <!-- Preenchido via JS pelo Içan -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal de Cadastro e Edição de Fornecedor + Endereço (Create / Update) -->
    <div id="modal_fornecedor" class="modal_overlay oculto">
        <div class="modal_conteudo modal_largo">
            <div class="modal_cabecalho">
                <h2 id="titulo_modal_fornecedor">Novo Fornecedor</h2>
                <button type="button" id="btn_fechar_modal_fornecedor" class="btn_fechar_modal">&times;</button>
            </div>

            <form id="form_fornecedor">
                <input type="hidden" id="idfornecedor" name="idfornecedor">
                <input type="hidden" id="endereco_idendereco" name="endereco_idendereco">

                <h4 class="subtitulo_modal">Dados da Empresa</h4>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="nome">Razão Social / Nome Fantasia *</label>
                        <input type="text" id="nome" name="nome" maxlength="45" required placeholder="Ex: Distribuidora Açaí Norte">
                    </div>

                    <div class="grupo_formulario">
                        <label for="cnpj">CNPJ *</label>
                        <input type="text" id="cnpj" name="cnpj" maxlength="18" required placeholder="00.000.000/0001-00">
                    </div>
                </div>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="telefone">Telefone / WhatsApp *</label>
                        <input type="text" id="telefone" name="telefone" maxlength="20" required placeholder="(27) 99999-9999">
                    </div>

                    <div class="grupo_formulario">
                        <label for="nome_contato">Nome do Vendedor / Contato</label>
                        <input type="text" id="nome_contato" name="nome_contato" maxlength="100" placeholder="Ex: Carlos Silva">
                    </div>
                </div>

                <div class="grupo_formulario">
                    <label for="email">E-mail Comercial</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="vendas@fornecedor.com.br">
                </div>

                <h4 class="subtitulo_modal">Endereço</h4>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" maxlength="9" required placeholder="29500-000">
                    </div>

                    <div class="grupo_formulario">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" name="bairro" maxlength="45" required placeholder="Ex: Centro">
                    </div>
                </div>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="logradouro">Logradouro (Rua / Av.) *</label>
                        <input type="text" id="logradouro" name="logradouro" maxlength="100" required placeholder="Ex: Av. Principal">
                    </div>

                    <div class="grupo_formulario">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" name="numero" maxlength="10" required placeholder="Ex: 120 ou S/N">
                    </div>
                </div>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento" maxlength="45" placeholder="Galpão, Sala, etc.">
                    </div>

                    <div class="grupo_formulario">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" maxlength="45" required placeholder="Ex: Alegre">
                    </div>
                </div>

                <div class="linha_formulario">
                    <div class="grupo_formulario">
                        <label for="uf">UF (Estado) *</label>
                        <input type="text" id="uf" name="uf" maxlength="2" required placeholder="ES">
                    </div>

                    <div class="grupo_formulario">
                        <label for="pais">País *</label>
                        <input type="text" id="pais" name="pais" maxlength="45" value="Brasil" required>
                    </div>
                </div>

                <div class="modal_rodape">
                    <button type="button" id="btn_cancelar_fornecedor" class="btn_secundario">Cancelar</button>
                    <button type="submit" class="btn_primario">Salvar Fornecedor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/fornecedores.js"></script>
</body>
</html>
